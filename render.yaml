services:
  - type: web
    name: foritza-app
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://foritza.onrender.com
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: MYSQL_ATTR_SSL_CA
        value: /app/certs/isrgrootx1.pem
      - key: MYSQL_ATTR_SSL_VERIFY_SERVER_CERT
        value: true
